name: Build Gallery

on:
  push:
    paths:
      - 'ass/**'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gallery-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache apt packages
      uses: actions/cache@v4
      id: cache-apt
      with:
        path: |
          /var/cache/apt/archives
        key: ${{ runner.os }}-apt-imagemagick-exiftool-ffmpeg

    - name: Install tools
      if: steps.cache-apt.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick libimage-exiftool-perl jq ffmpeg

    - name: Restore generated images cache
      uses: actions/cache@v4
      id: cache-images
      with:
        path: |
          thumbs
          blur
          webp
          video
        key: gallery-images-${{ hashFiles('thumbs/**', 'blur/**', 'webp/**', 'video/**', 'gallery.json') }}
        restore-keys: |
          gallery-images-

    - name: Generate gallery
      run: |
        set -e
        mkdir -p thumbs blur webp video

        # 20MB limit in bytes
        MAX_SIZE=20971520

        shopt -s nullglob
        files=(ass/*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No files found in ass/ directory"
          echo "[]" > gallery.json
          exit 0
        fi

        entries=()
        processed_files=()
        
        for f in "${files[@]}"; do
          [ -f "$f" ] || continue
          name=$(basename "$f")
          base="${name%.*}"
          lc="${name##*.}"
          lc="${lc,,}"  # lowercase extension

          # get size in bytes
          size=$(stat -c%s "$f" 2>/dev/null || wc -c < "$f" || echo 0)

          # get date from EXIF or file mtime
          date=$(exiftool -DateTimeOriginal -d "%Y-%m-%dT%H:%M:%S" -s3 "$f" 2>/dev/null || true)
          if [ -z "$date" ]; then
            date=$(date -r "$f" +"%Y-%m-%dT%H:%M:%S")
          fi

          # choose processing path by type
          case "$lc" in
            jpg|jpeg|png|webp|bmp|tiff)
              type="image"
              # create thumb + blur + webp full
              if [ ! -f "thumbs/$name" ]; then
                convert "$f" -strip -resize 600x600\> "thumbs/$name" || echo "thumb-fail:$name"
              fi
              if [ ! -f "blur/$name" ]; then
                convert "$f" -strip -resize 40x40 -blur 0x6 "blur/$name" || echo "blur-fail:$name"
              fi
              if [ ! -f "webp/$base.webp" ]; then
                convert "$f" -strip -quality 80 "webp/$base.webp" || echo "webp-fail:$name"
              fi
              thumb="thumbs/$name"
              blurimg="blur/$name"
              full="webp/$base.webp"
              processed_files+=("$f")
              ;;
            gif)
              # Convert GIF to MP4 for 80-90% size reduction
              type="video"
              
              # Create thumbnail from first frame
              if [ ! -f "thumbs/$base.jpg" ]; then
                convert "$f[0]" -strip -resize 600x600\> "thumbs/$base.jpg" || echo "thumb-fail:$name"
              fi
              if [ ! -f "blur/$base.jpg" ]; then
                convert "$f[0]" -strip -resize 40x40 -blur 0x6 "blur/$base.jpg" || echo "blur-fail:$name"
              fi
              
              # Convert GIF to MP4
              if [ ! -f "video/$base.mp4" ]; then
                ffmpeg -i "$f" -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -movflags +faststart "video/$base.mp4" 2>/dev/null || echo "gif-convert-fail:$name"
              fi
              
              # Check if conversion succeeded
              if [ -f "video/$base.mp4" ]; then
                thumb="thumbs/$base.jpg"
                blurimg="blur/$base.jpg"
                full="video/$base.mp4"
                processed_files+=("$f")
              else
                echo "::warning file=$f::GIF conversion failed. Skipping."
              fi
              ;;
            mp4|webm|mov|ogg)
              type="video"
              
              # Check if file exceeds 20MB
              if [ "$size" -gt "$MAX_SIZE" ]; then
                echo "Video $name exceeds 20MB ($size bytes), attempting compression..."
                
                # First pass: CRF 28
                if [ ! -f "video/$base.mp4" ]; then
                  ffmpeg -i "$f" -c:v libx264 -preset fast -crf 28 -c:a aac -b:a 128k -movflags +faststart "video/$base.mp4" 2>/dev/null || echo "ff-compress1-fail:$name"
                fi
                
                # Check result size
                if [ -f "video/$base.mp4" ]; then
                  new_size=$(stat -c%s "video/$base.mp4")
                  if [ "$new_size" -gt "$MAX_SIZE" ]; then
                    echo "First pass result still exceeds 20MB ($new_size bytes), attempting second pass..."
                    # Second pass: CRF 32 + downscale to 720p
                    rm -f "video/$base.mp4"
                    ffmpeg -i "$f" -c:v libx264 -preset fast -crf 32 -vf "scale=-2:min(720\\,ih)" -c:a aac -b:a 96k -movflags +faststart "video/$base.mp4" 2>/dev/null || echo "ff-compress2-fail:$name"
                  fi
                fi
                
                # Final check
                if [ -f "video/$base.mp4" ]; then
                  final_size=$(stat -c%s "video/$base.mp4")
                  if [ "$final_size" -gt "$MAX_SIZE" ]; then
                    echo "::warning file=$f::Video exceeds 20MB even after compression ($final_size bytes). Skipping."
                    rm -f "video/$base.mp4"
                    continue
                  fi
                else
                  echo "::warning file=$f::Video compression failed. Skipping."
                  continue
                fi
                
                thumb="thumbs/$base.jpg"
                blurimg="blur/$base.jpg"
                full="video/$base.mp4"
              else
                # Under 20MB - transcode to MP4 for consistency
                if [ ! -f "video/$base.mp4" ]; then
                  ffmpeg -i "$f" -c:v libx264 -preset fast -crf 23 -c:a aac -b:a 128k -movflags +faststart "video/$base.mp4" 2>/dev/null || echo "ff-transcode-fail:$name"
                fi
                
                if [ ! -f "video/$base.mp4" ]; then
                  echo "::warning file=$f::Video transcoding failed. Skipping."
                  continue
                fi
                
                thumb="thumbs/$base.jpg"
                blurimg="blur/$base.jpg"
                full="video/$base.mp4"
              fi
              
              # Generate thumbnail
              if [ ! -f "thumbs/$base.jpg" ]; then
                ffmpeg -y -i "$f" -vframes 1 -vf "scale='min(600,iw)':'min(600,ih)':force_original_aspect_ratio=decrease" "thumbs/$base.jpg" 2>/dev/null || echo "ff-thumb-fail:$name"
              fi
              if [ ! -f "blur/$base.jpg" ]; then
                convert "thumbs/$base.jpg" -resize 40x40 -blur 0x6 "blur/$base.jpg" || echo "blur-fail:$name"
              fi
              
              processed_files+=("$f")
              ;;
            mkv|avi)
              type="video"
              
              # Check if file exceeds 20MB
              if [ "$size" -gt "$MAX_SIZE" ]; then
                echo "Video $name exceeds 20MB ($size bytes), attempting compression..."
                
                # First pass: CRF 28
                if [ ! -f "video/$base.mp4" ]; then
                  ffmpeg -i "$f" -c:v libx264 -preset fast -crf 28 -c:a aac -b:a 128k -movflags +faststart "video/$base.mp4" 2>/dev/null || echo "ff-compress1-fail:$name"
                fi
                
                # Check result size
                if [ -f "video/$base.mp4" ]; then
                  new_size=$(stat -c%s "video/$base.mp4")
                  if [ "$new_size" -gt "$MAX_SIZE" ]; then
                    echo "First pass result still exceeds 20MB ($new_size bytes), attempting second pass..."
                    # Second pass: CRF 32 + downscale to 720p
                    rm -f "video/$base.mp4"
                    ffmpeg -i "$f" -c:v libx264 -preset fast -crf 32 -vf "scale=-2:min(720\\,ih)" -c:a aac -b:a 96k -movflags +faststart "video/$base.mp4" 2>/dev/null || echo "ff-compress2-fail:$name"
                  fi
                fi
                
                # Final check
                if [ -f "video/$base.mp4" ]; then
                  final_size=$(stat -c%s "video/$base.mp4")
                  if [ "$final_size" -gt "$MAX_SIZE" ]; then
                    echo "::warning file=$f::Video exceeds 20MB even after compression ($final_size bytes). Skipping."
                    rm -f "video/$base.mp4"
                    continue
                  fi
                else
                  echo "::warning file=$f::Video compression failed. Skipping."
                  continue
                fi
              else
                # Under 20MB - transcode to MP4
                if [ ! -f "video/$base.mp4" ]; then
                  ffmpeg -i "$f" -c:v libx264 -preset fast -crf 23 -c:a aac -b:a 128k -movflags +faststart "video/$base.mp4" 2>/dev/null || echo "ff-transcode-fail:$name"
                fi
                
                if [ ! -f "video/$base.mp4" ]; then
                  echo "::warning file=$f::Video transcoding failed. Skipping."
                  continue
                fi
              fi
              
              # Generate thumbnail
              if [ ! -f "thumbs/$base.jpg" ]; then
                ffmpeg -y -i "$f" -vframes 1 -vf "scale='min(600,iw)':'min(600,ih)':force_original_aspect_ratio=decrease" "thumbs/$base.jpg" 2>/dev/null || echo "ff-thumb-fail:$name"
              fi
              if [ ! -f "blur/$base.jpg" ]; then
                convert "thumbs/$base.jpg" -resize 40x40 -blur 0x6 "blur/$base.jpg" || echo "blur-fail:$name"
              fi
              
              thumb="thumbs/$base.jpg"
              blurimg="blur/$base.jpg"
              full="video/$base.mp4"
              processed_files+=("$f")
              ;;
            *)
              # unknown: treat as image fallback
              type="image"
              if [ ! -f "thumbs/$name" ]; then
                convert "$f" -strip -resize 600x600\> "thumbs/$name" || echo "thumb-fail:$name"
              fi
              if [ ! -f "blur/$name" ]; then
                convert "$f" -strip -resize 40x40 -blur 0x6 "blur/$name" || echo "blur-fail:$name"
              fi
              if [ ! -f "webp/$base.webp" ]; then
                convert "$f" -strip -quality 80 "webp/$base.webp" || echo "webp-fail:$name"
              fi
              thumb="thumbs/$name"
              blurimg="blur/$name"
              full="webp/$base.webp"
              processed_files+=("$f")
              ;;
          esac

          # proper JSON escaping using jq
          entry=$(jq -n \
            --arg name "$name" \
            --arg date "$date" \
            --argjson size "$size" \
            --arg type "$type" \
            --arg thumb "$thumb" \
            --arg blur "$blurimg" \
            --arg full "$full" \
            '{name:$name, date:$date, size:$size, type:$type, thumb:$thumb, blur:$blur, full:$full}')
          entries+=("$entry")
        done

        # push array to gallery.json
        printf '%s\n' "${entries[@]}" | jq -s '.' > gallery.json
        echo "Generated gallery.json with $(jq 'length' gallery.json) entries"
        
        # Delete processed original files from ass/
        echo "Deleting ${#processed_files[@]} processed files from ass/..."
        for f in "${processed_files[@]}"; do
          rm -f "$f"
        done

    - name: Commit
      run: |
        git config user.name "gallery-bot"
        git config user.email "bot@example.com"
        git add thumbs blur webp video gallery.json
        git add -u ass/  # Stage deletions
        git diff --staged --quiet && echo "No changes to commit" || {
          git commit -m "update gallery"
          git push
        }
