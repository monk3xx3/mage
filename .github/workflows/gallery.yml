name: Build Gallery

on:
  push:
    paths:
      - 'ass/**'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gallery-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache apt packages
      uses: actions/cache@v4
      id: cache-apt
      with:
        path: |
          /var/cache/apt/archives
        key: ${{ runner.os }}-apt-imagemagick-exiftool

    - name: Install tools
      if: steps.cache-apt.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick libimage-exiftool-perl jq

    - name: Restore generated images cache
      uses: actions/cache@v4
      id: cache-images
      with:
        path: |
          thumbs
          blur
          webp
        key: gallery-images-${{ hashFiles('ass/**') }}
        restore-keys: |
          gallery-images-

    - name: Generate gallery
      run: |
        set -e
        
        mkdir -p thumbs blur webp
        
        # Check if ass directory has files
        shopt -s nullglob
        files=(ass/*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No files found in ass/ directory"
          echo "[]" > gallery.json
          exit 0
        fi
        
        # Build JSON array using jq for proper escaping
        entries=()
        for f in "${files[@]}"; do
          [ -f "$f" ] || continue
          
          name=$(basename "$f")
          base="${name%.*}"
          
          # Skip if all outputs already exist (from cache)
          if [ -f "thumbs/$name" ] && [ -f "blur/$name" ] && [ -f "webp/$base.webp" ]; then
            echo "Skipping (cached): $name"
          else
            echo "Processing: $name"
            
            # Convert images with error handling
            convert "$f" -resize 600x600 "thumbs/$name" || echo "Warning: Failed to create thumb for $name"
            convert "$f" -resize 30x30 -blur 0x8 "blur/$name" || echo "Warning: Failed to create blur for $name"
            convert "$f" -quality 80 "webp/$base.webp" || echo "Warning: Failed to create webp for $name"
          fi
          
          # Get date from EXIF or file modification time
          date=$(exiftool -DateTimeOriginal -d "%Y-%m-%dT%H:%M:%S" -s3 "$f" 2>/dev/null)
          if [ -z "$date" ]; then
            date=$(date -r "$f" +"%Y-%m-%dT%H:%M:%S")
          fi
          
          # Use jq for proper JSON escaping
          entry=$(jq -n -c --arg name "$name" --arg date "$date" '{"name": $name, "date": $date}')
          entries+=("$entry")
        done
        
        # Create final JSON array
        printf '%s\n' "${entries[@]}" | jq -s '.' > gallery.json
        
        echo "Generated gallery.json with $(jq 'length' gallery.json) entries"

    - name: Commit
      run: |
        git config user.name "gallery-bot"
        git config user.email "bot@example.com"
        git add thumbs blur webp gallery.json
        git diff --staged --quiet && echo "No changes to commit" || {
          git commit -m "update gallery"
          git push
        }
